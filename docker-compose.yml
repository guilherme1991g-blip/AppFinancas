services:
  mongodb:
    image: mongo:7.0
    container_name: financas_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: appfinancas
    volumes:
      - mongo_data:/data/db
    networks:
      - financas_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financas_backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: appfinancas
      SECRET_KEY: ${SECRET_KEY:-mude-esta-chave-em-producao-2024}
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - financas_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    container_name: financas_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - financas_net

volumes:
  mongo_data:

networks:
  financas_net:
    driver: bridge
