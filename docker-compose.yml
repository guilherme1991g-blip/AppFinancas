services:
  mongodb:
    image: mongo:7.0
    container_name: financas_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: appfinancas
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-adminotto}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-OttoFin2024Secure}
    volumes:
      - mongo_data:/data/db
    # Porta NÃO exposta externamente — só acessível pela rede interna Docker
    networks:
      - financas_net

  backend:
    image: ghcr.io/guilherme1991g-blip/appfinancas-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financas_backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://${MONGO_USER:-adminotto}:${MONGO_PASS:-OttoFin2024Secure}@mongodb:27017
      DATABASE_NAME: appfinancas
      SECRET_KEY: ${SECRET_KEY:-mude-esta-chave-em-producao-2024}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongodb
    networks:
      - financas_net

  frontend:
    image: ghcr.io/guilherme1991g-blip/appfinancas-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    container_name: financas_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:80"
    depends_on:
      - backend
    networks:
      - financas_net

volumes:
  mongo_data:

networks:
  financas_net:
    driver: bridge
