server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/javascript text/javascript;

    # SPA fallback principal
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirecionar /dev-admin (sem barra) para /dev-admin/ (com barra)
    location = /dev-admin {
        return 301 $scheme://$host$request_uri/;
    }

    # Proxy para o Admin com STRIP PREFIX e PROTEÇÃO CONTRA REGEX (^~)
    # O modificador ^~ impede que as outras regras de regex no final do arquivo "roubem" os assets do admin
    location ^~ /dev-admin/ {
        # A barra no final de http://admin:80/ faz o Nginx remover o /dev-admin/ automaticamente
        proxy_pass http://admin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para evitar erros 504/500 em builds lentas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache para assets estáticos do frontend principal
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
