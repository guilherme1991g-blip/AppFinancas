server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/javascript text/javascript;

    # SPA fallback principal
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirecionar /dev-admin (sem barra) para /dev-admin/ (com barra)
    location = /dev-admin {
        return 301 $scheme://$host$request_uri/;
    }

    # Proxy para o Admin
    # ^~ garante prioridade sobre regras regex (como a de cache de assets abaixo)
    # rewrite remove o prefixo /dev-admin/ antes de enviar para o container
    # resolver + variável evita crash se o container admin não estiver rodando
    location ^~ /dev-admin/ {
        resolver 127.0.0.11 valid=30s;
        set $admin http://admin:80;

        rewrite ^/dev-admin/(.*) /$1 break;
        proxy_pass $admin;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache para assets estáticos do frontend principal
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
