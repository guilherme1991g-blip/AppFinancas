server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/javascript text/javascript;

    # Resolver do Docker para permitir proxy_pass com variáveis
    resolver 127.0.0.11 valid=30s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirecionar /dev-admin (sem barra) para /dev-admin/ (com barra)
    location = /dev-admin {
        return 301 $scheme://$host$request_uri/;
    }

    # Proxy para o Admin na subpasta /dev-admin
    # Passamos o URI completo (/dev-admin/...) e o admin container resolve internamente
    location /dev-admin/ {
        set $admin_service http://admin:80;
        proxy_pass $admin_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
